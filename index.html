<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://esm.sh; connect-src 'self' https://esm.sh https://*.supabase.co wss://*.supabase.co; img-src 'self' data: blob: https://*.supabase.co; style-src 'self' 'unsafe-inline'; font-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://connect.stripe.com https://checkout.stripe.com; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Permissions-Policy" content="camera=(self), microphone=(), geolocation=(), payment=(self)">
  <meta name="theme-color" content="#fffdf8">
  <meta name="description" content="Open-source race registration and event management for organizers, runners, and their communities.">
  <meta property="og:title" content="OpenStart">
  <meta property="og:description" content="Great race days start in the open.">
  <meta property="og:image" content="og.png">
  <meta name="twitter:card" content="summary_large_image">
  <title>OpenStart — Open-source race registration</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=107">
  <script src="theme.js?v=73"></script>
</head>
<body>
  <div id="setup-banner" class="setup-banner hidden">
    Demo mode is active. Add your Supabase URL and publishable key to <code>config.js</code> to enable shared data and accounts.
  </div>

  <header class="site-header">
    <button class="brand" data-action="discover" type="button" aria-label="OpenStart home"><span class="brand-mark" aria-hidden="true">OS</span><span>OpenStart</span></button>
    <nav aria-label="Primary navigation">
      <button class="nav-active" data-view="discover" data-icon="🔍" type="button"><span class="nav-label" data-short="Events">Find events</span></button>
      <button data-view="demo" data-icon="✨" type="button"><span class="nav-label" data-short="Demo">Demo</span></button>
      <button data-view="runner" data-icon="🏃" type="button"><span class="nav-label" data-short="Races">My races</span></button>
      <button data-view="dashboard" data-icon="📋" type="button"><span class="nav-label" data-short="Organize">Organizer</span></button>
      <button id="platform-nav" class="hidden" data-view="platform" data-icon="⚙️" type="button"><span class="nav-label" data-short="Platform">Platform</span></button>
      <button data-view="help" data-icon="💬" type="button"><span class="nav-label" data-short="Help">Help</span></button>
    </nav>
    <div class="account-actions">
      <span class="sandbox-badge" title="Payments use Stripe test mode">Sandbox</span>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch color theme">
        <span class="theme-toggle-icon" aria-hidden="true">☾</span>
        <span class="theme-toggle-label">Dark</span>
      </button>
      <button id="auth-button" class="github-link" type="button">Sign in</button>
      <button id="sign-out" class="github-link hidden" type="button">Sign out</button>
    </div>
  </header>

  <div id="notice" class="notice hidden" role="status"><span></span><button aria-label="Dismiss notification" type="button">×</button></div>

  <main id="page-content" tabindex="-1"></main>

  <dialog id="app-dialog"><div id="dialog-content"></div></dialog>

  <footer>
    <span><b>OpenStart</b> · Open-source race registration</span>
    <span>Built for organizers, runners, and the communities between them. <button data-view="architecture" type="button">Architecture</button></span>
  </footer>

  <script type="module" src="app.js?v=107"></script>
</body>
</html>
